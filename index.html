<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>JavaScript异步寻宝实验</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft Yahei;}
body{background:#111827;color:#fff;padding:30px;}
.wrap{max-width:720px;margin:0 auto;}
.card{background:#1f2937;padding:24px;border-radius:16px;box-shadow:0 0 16px #2563eb60;}
#log{height:320px;overflow-y:auto;background:#111827;padding:14px;border-radius:8px;margin:18px 0;line-height:1.7}
.step{opacity:0;transform:translateY(8px);animation:fadeIn 0.5s forwards;margin:6px 0;}
.treasure-icon{text-align:center;font-size:48px;opacity:0;transform:scale(0.2);margin:20px 0;}
.treasure-icon.show{animation:pop 1s forwards;}
button{padding:10px 22px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-size:16px;cursor:pointer;margin:5px;}
button:disabled{background:#444;cursor:not-allowed;}
@keyframes fadeIn{to{opacity:1;transform:translateY(0);}}
@keyframes pop{to{opacity:1;transform:scale(1);}}
.hint{color:#60a5fa;}
.fail{color:#fbbf24;}
.success{color:#34d399;font-weight:bold;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2>🏺 神庙寻宝游戏（async/await版本）</h2>
    <div id="log"></div>
    <div class="treasure-icon" id="treasure">📦</div>
    <button id="startBtn">开始寻宝</button>
    <button id="resetBtn" disabled>重置</button>
  </div>
</div>

<script>
// 老师提供的原始TreasureMap类
class TreasureMap {
  static getInitialClue() {
    return new Promise((resolve) => {
      setTimeout(() => {
        resolve("在古老的图书馆里找到了第一个线索...");
      }, 1000);
    });
  }

  static decodeAncientScript(clue) {
    return new Promise((resolve, reject) => {
      setTimeout(() => {
        if (!clue) {
          reject("没有线索可以解码!");
        }
        resolve("解码成功!宝藏在一座古老的神庙中...");
      }, 1500);
    });
  }

  static searchTemple(location) {
    return new Promise((resolve, reject) => {
      setTimeout(() => {
        const random = Math.random();
        if (random < 0.5) {
          reject("糟糕!遇到了神庙守卫!");
        }
        resolve("找到了一个神秘的箱子...");
      }, 2000);
    });
  }

  static openTreasureBox() {
    return new Promise((resolve) => {
      setTimeout(() => {
        resolve("恭喜!你找到了传说中的宝藏!");
      }, 1000);
    });
  }
}

const logDom = document.getElementById("log");
const treasureDom = document.getElementById("treasure");
const startBtn = document.getElementById("startBtn");
const resetBtn = document.getElementById("resetBtn");

//打印日志，带动画
function printMsg(text, type=""){
  const div = document.createElement("div");
  div.className = `step ${type}`;
  div.innerText = text;
  logDom.appendChild(div);
  logDom.scrollTop = logDom.scrollHeight;
}

// async/await重写寻宝主流程
async function findTreasureWithAsyncAwait(){
  startBtn.disabled = true;
  resetBtn.disabled = true;
  logDom.innerHTML = "";
  treasureDom.classList.remove("show");

  try{
    const clue = await TreasureMap.getInitialClue();
    printMsg(clue, "hint");

    const location = await TreasureMap.decodeAncientScript(clue);
    printMsg(location, "hint");

    const box = await TreasureMap.searchTemple(location);
    printMsg(box, "hint");

    const treasure = await TreasureMap.openTreasureBox();
    printMsg(treasure, "success");
    treasureDom.classList.add("show");
  }catch(err){
    printMsg("❌任务失败："+err,"fail");
  }
  resetBtn.disabled = false;
}

startBtn.onclick = findTreasureWithAsyncAwait;
resetBtn.onclick = ()=>{
  logDom.innerHTML = "";
  treasureDom.classList.remove("show");
  startBtn.disabled = false;
}
</script>
</body>
</html>
